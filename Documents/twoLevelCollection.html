<!DOCTYPE html>
<html>
  <body>
    Two levels collection with ol and li
    <ol>
      {{ for item in items}}
      <ol>
        {{item.name}}
        <div style="padding-left: 35px">
          {{ for subItem in item.subItems}}
          <li>{{ subItem.name}}</li>
          {{ end }}
        </div>
        <br />
      </ol>
      {{ end }}
    </ol>
  </body>
</html>
