<!DOCTYPE html>
<html>
  <head>
    <style>
      table {
        font-family: arial, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    Simple table
    <table>
      <tr>
        {{ for col in table.header }}
        <th>{{ col.label }}</th>
        {{ end }}
      </tr>
      {{ for row in table.data }}
      <tr>
        {{ for col in table.header }}
        <td>{{ row[col.key] }}</td>
        {{ end }}
      </tr>
      {{ end }}
    </table>
  </body>
</html>
